plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vivolite.launcher'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vivolite.launcher'
        minSdk 21
        targetSdk 28
        versionCode 30
        versionName '1.5.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
