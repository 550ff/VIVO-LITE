name: Build VIVO LITE APK

on:
  workflow_dispatch:
  push:
    branches: [ "v1.1", "v1.4-premium-experience" ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK Platform 36 and Build Tools 35.0.0
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon --console=plain --stacktrace --warning-mode all assembleDebug
      - name: Validate APK metadata and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.vivolite.launcher' versionCode='15' versionName='1.4.3'"
          sha256sum "$APK" > "$APK.sha256"
      - name: Upload final APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: VIVO-LITE-V1.4.3-final-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
